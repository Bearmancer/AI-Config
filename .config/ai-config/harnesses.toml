# Registry of the live paths each harness reads. `ai-config doctor` reads this file.
#
# One table per harness, four cells each:
#   instructions  the global instruction file the harness loads
#   mcp           the file that carries the MCP server set (the same ten servers
#                 in every harness: OpenCode's set in opencode.jsonc)
#   skills        the folder the harness reads skills from
#   files         every other config file the harness owns
#
# A cell is an inline table. `path` is a live path (`~` = home). `tracked` is
# true when the file is committed in ~/Dev/AI-Config, false when an app owns it and
# setup or a restore writes it. `na` replaces `path` with the reason the cell
# does not apply; a cell never goes silently missing. `json_only` marks a file
# that must stay `.json` because its reader loads no `.jsonc` of that stem, and
# gives the reason. `optional = true` means the file may be absent on a PC.
# `env_ref` is the syntax the harness uses to read a secret from the
# environment; MCP stanzas carry command and args plus env refs, never values.
# `writer` says who produces an untracked file ("setup" = scripts/setup.*).
#
# The one instruction file is ~/.agents/AGENTS.md. Skills are restored by
# `npx skills experimental_install` from ~/skills-lock.json into
# ~/.agents/skills, which every universal agent reads (omo, opencode, kilo,
# cline); that command never creates Claude links.

# `shared` holds the rules every harness's MCP cell obeys: the one server that
# is enabled everywhere, and the env keys whose value may be a literal because
# it is not a secret (value must match the regex).
[shared]
enabled_servers = ["codegraph"]
literal_env = { ZOTERO_LIBRARY_ID = "^[0-9]+$" }

[omo]
instructions = { na = "senpi loads global context only from ~/.omo/agent/ and has no setting that names another path" }
mcp = { path = "~/.omo/agent/mcp.json", tracked = true, env_ref = "${VAR}", servers_at = "mcpServers", json_only = "omo reads agent/mcp.json only; no mcp.jsonc loader (probed 2026-10-31)" }
skills = { path = "~/.agents/skills", tracked = false, writer = "npx skills experimental_install" }
files = [
  { path = "~/.omo/omo.jsonc", tracked = true },
  { path = "~/.omo/agent/settings.jsonc", tracked = true },
  { path = "~/.omo/agent/keybindings.json", tracked = true, json_only = "omo reads agent/keybindings.json only; no keybindings.jsonc loader (probed 2026-10-31)" },
  { path = "~/.omo/agent/models.json", tracked = true, json_only = "omo reads agent/models.json only; no models.jsonc loader (probed 2026-10-31)" },
]

[opencode]
instructions = { path = "~/.agents/AGENTS.md", tracked = true, via = "opencode.jsonc `instructions`" }
mcp = { path = "~/.config/opencode/opencode.jsonc", tracked = true, env_ref = "{env:VAR}", servers_at = "mcp.servers" }
skills = { path = "~/.agents/skills", tracked = false, writer = "npx skills experimental_install" }
files = [
  { path = "~/.config/opencode/tui-preferences.jsonc", tracked = true },
  { path = "~/.config/opencode/cli.json", tracked = true, json_only = "OpenCode v2.2.4 loads cli.json only; the binary holds no cli.jsonc (probed 2026-10-31)" },
  { path = "~/.config/opencode/oh-my-opencode-slim.jsonc", tracked = true },
  { path = "~/.config/opencode/oh-my-opencode-slim/orchestrator_append.md", tracked = true, optional = true },
  { path = "~/.config/opencode/plugins/forbidden-terminal-commands.ts", tracked = true },
  { path = "~/.config/opencode/plugins/force-pathlib.ts", tracked = true },
  { path = "~/.config/cortexkit/magic-context.jsonc", tracked = true },
]

[kilo]
instructions = { path = "~/.agents/AGENTS.md", tracked = true, via = "kilo.jsonc `instructions`" }
mcp = { path = "~/.config/kilo/kilo.jsonc", tracked = true, env_ref = "{env:VAR}", servers_at = "mcp.servers" }
skills = { path = "~/.agents/skills", tracked = false, writer = "npx skills experimental_install" }
files = [
  { path = "~/.config/kilo/kilo.jsonc", tracked = true },
]

[cline]
instructions = { path = "~/.agents/AGENTS.md", tracked = true, via = "Cline reads ~/.agents/AGENTS.md natively" }
mcp = { path = "~/.cline/data/settings/cline_mcp_settings.json", tracked = false, writer = "setup", env_ref = "${env:VAR}", servers_at = "mcpServers", json_only = "Cline names cline_mcp_settings.json only; no .jsonc name exists (probed 2026-10-31)" }
skills = { path = "~/.agents/skills", tracked = false, writer = "npx skills experimental_install" }
files = [
  { path = "~/.cline/rules", tracked = true, optional = true },
  { path = "~/.cline/workflows", tracked = true, optional = true },
  { path = "~/.cline/hooks", tracked = true, optional = true },
  { path = "~/.cline/skills", tracked = true, optional = true },
]

[claude]
instructions = { path = "~/.agents/AGENTS.md", tracked = true, via = "~/.claude/CLAUDE.md single import line @~/.agents/AGENTS.md" }
mcp = { path = "~/.claude.json", tracked = false, writer = "setup", env_ref = "${VAR}", servers_at = "mcpServers" }
# Claude Code loads personal skills from ~/.claude/skills/<name>/SKILL.md
# (https://code.claude.com/docs/en/skills, "Choose where skills load").
# Skills are latest-only: every skills dir must hold exactly the lock's skills,
# so a skill removed from the lock (or upstream) is purged, never left behind
# (`npx skills remove <name> -y`). `exclude` lists harness-owned entries that
# the comparison ignores; `synced` is claude.ai-managed.
skills = { path = "~/.claude/skills", tracked = false, writer = "npx skills add -a claude-code", exclude = ["synced"] }
files = [
  { path = "~/.claude/settings.json", tracked = true },
]
