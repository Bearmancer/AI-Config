# Registry of the live paths each harness reads. `ai-config doctor` reads this file.
#
# One mapping per harness, four cells each:
#   instructions  the global instruction file the harness loads
#   mcp           the file that carries the MCP server set (the same twelve
#                 servers wherever the harness mirrors OpenCode: OpenCode's set
#                 in opencode.jsonc; Claude holds codegraph alone; Command Code
#                 keeps its own set, adding linear)
#   skills        the folder the harness reads skills from
#   files         every other config file the harness owns
#
# A cell is a mapping. `path` is a live path (`~` = home). `tracked` is true
# when the file is committed in ~/Dev/AI-Config, false when an app owns it and
# setup or a restore writes it. `na` replaces `path` with the reason the cell
# does not apply; a cell never goes silently missing. `json_only` marks a file
# that must stay `.json` because its reader loads no `.jsonc` of that stem, and
# gives the reason. `optional = true` means the file may be absent on a PC.
# `env_ref` is the syntax the harness uses to read a secret from the
# environment; MCP stanzas carry command and args plus env refs, never values.
# `writer` says who produces an untracked file ("setup" = scripts/setup.*).
#
# The one instruction file is ~/.agents/AGENTS.md. Skills are restored by
# `npx skills experimental_install` from ~/skills-lock.json into
# ~/.agents/skills, which every universal agent reads (omo, opencode, kilo,
# cline); Command Code reads the same folder through junctions under
# ~/.commandcode/skills. That command never creates Claude links.

# `shared` names the servers the setup script leaves enabled when it writes the
# app-owned Cline and Claude files. Doctor reads no rules from it: its MCP check
# is server-name parity against OpenCode's file.
shared:
  enabled_servers:
    - codegraph

omo:
  instructions:
    path: "~/.agents/AGENTS.md"
    tracked: true
    via: "senpi loads ~/.omo/agent/AGENTS.md as global context; the file is a hard link, the same instance as ~/.agents/AGENTS.md"
    link: "~/.omo/agent/AGENTS.md"
  mcp:
    path: "~/.omo/agent/mcp.json"
    tracked: true
    env_ref: "${VAR}"
    servers_at: "mcpServers"
    json_only: "omo reads agent/mcp.json only; no mcp.jsonc loader (probed 2026-10-31)"
  skills:
    path: "~/.agents/skills"
    tracked: false
    writer: "npx skills experimental_install"
  files:
    - path: "~/.omo/omo.jsonc"
      tracked: true
    - path: "~/.omo/agent/settings.jsonc"
      tracked: true
    - path: "~/.omo/agent/keybindings.json"
      tracked: true
      json_only: "omo reads agent/keybindings.json only; no keybindings.jsonc loader (probed 2026-10-31)"
    - path: "~/.omo/agent/models.json"
      tracked: true
      json_only: "omo reads agent/models.json only; no models.jsonc loader (probed 2026-10-31)"

opencode:
  instructions:
    path: "~/.agents/AGENTS.md"
    tracked: true
    via: "opencode.jsonc `instructions`"
  mcp:
    path: "~/.config/opencode/opencode.jsonc"
    tracked: true
    env_ref: "{env:VAR}"
    servers_at: "mcp.servers"
    enabled_servers: [browse, codegraph, exa, firecrawl, tavily, zenrows]
  skills:
    path: "~/.agents/skills"
    tracked: false
    writer: "npx skills experimental_install"
  files:
    - path: "~/.config/opencode/tui-preferences.jsonc"
      tracked: true
    - path: "~/.config/opencode/cli.json"
      tracked: true
      json_only: "OpenCode v2.2.4 loads cli.json only; the binary holds no cli.jsonc (probed 2026-10-31)"
    - path: "~/.config/opencode/oh-my-opencode-slim.jsonc"
      tracked: true
    - path: "~/.config/opencode/oh-my-opencode-slim/orchestrator_append.md"
      tracked: true
      optional: true
    - path: "~/.config/opencode/plugins/banned-paths.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/forbidden-terminal-commands.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/force-pathlib.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/no-restart.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/ps1-lint.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/python-cli-utf8.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/question-gate.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/ssh-paramiko-only.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/uv-only-python.ts"
      tracked: true
    - path: "~/.config/opencode/plugins/uv-run-script.ts"
      tracked: true
    - path: "~/.config/opencode/commands/just-ask-me.md"
      tracked: true
    - path: "~/.agents/scripts/plugin-lint/ps1-check.ps1"
      tracked: true
    - path: "~/.config/opencode/service/opencode-service-runner.ps1"
      tracked: true
    - path: "~/.config/cortexkit/magic-context.jsonc"
      tracked: true

kilo:
  instructions:
    path: "~/.agents/AGENTS.md"
    tracked: true
    via: "kilo.jsonc `instructions`"
  mcp:
    path: "~/.config/kilo/kilo.jsonc"
    tracked: true
    env_ref: "{env:VAR}"
    servers_at: "mcp.servers"
  skills:
    path: "~/.agents/skills"
    tracked: false
    writer: "npx skills experimental_install"
  files:
    - path: "~/.config/kilo/kilo.jsonc"
      tracked: true
    - path: "~/.config/kilo/plugin/banned-paths.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/forbidden-terminal-commands.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/force-pathlib.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/ps1-lint.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/python-cli-utf8.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/ssh-paramiko-only.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/uv-only-python.ts"
      tracked: true
    - path: "~/.config/kilo/plugin/uv-run-script.ts"
      tracked: true

cline:
  instructions:
    path: "~/.agents/AGENTS.md"
    tracked: true
    via: "Cline reads ~/.agents/AGENTS.md natively"
  mcp:
    path: "~/.cline/data/settings/cline_mcp_settings.json"
    tracked: false
    writer: "setup"
    env_ref: "${env:VAR}"
    servers_at: "mcpServers"
    json_only: "Cline names cline_mcp_settings.json only; no .jsonc name exists (probed 2026-10-31)"
  skills:
    path: "~/.agents/skills"
    tracked: false
    writer: "npx skills experimental_install"
  files:
    - path: "~/.cline/rules"
      tracked: true
      optional: true
    - path: "~/.cline/workflows"
      tracked: true
      optional: true
    - path: "~/.cline/hooks"
      tracked: true
      optional: true
    - path: "~/.cline/hooks/PreToolUse.ts"
      tracked: true
    - path: "~/.cline/hooks/banned-paths.ts"
      tracked: true
    - path: "~/.cline/hooks/forbidden-terminal-commands.ts"
      tracked: true
    - path: "~/.cline/hooks/force-pathlib.ts"
      tracked: true
    - path: "~/.cline/hooks/ps1-lint.ts"
      tracked: true
    - path: "~/.cline/hooks/python-cli-utf8.ts"
      tracked: true
    - path: "~/.cline/hooks/ssh-paramiko-only.ts"
      tracked: true
    - path: "~/.cline/hooks/uv-only-python.ts"
      tracked: true
    - path: "~/.cline/hooks/uv-run-script.ts"
      tracked: true
    - path: "~/.cline/skills"
      tracked: true
      optional: true

claude:
  instructions:
    path: "~/.agents/AGENTS.md"
    tracked: true
    via: "~/.claude/CLAUDE.md single import line @~/.agents/AGENTS.md"
  mcp:
    path: "~/.claude.json"
    tracked: false
    writer: "setup"
    env_ref: "${VAR}"
    servers_at: "mcpServers"
  # Claude Code loads personal skills from ~/.claude/skills/<name>/SKILL.md
  # (https://code.claude.com/docs/en/skills, "Choose where skills load").
  # Skills are latest-only: every skills dir must hold exactly the lock's skills,
  # so a skill removed from the lock (or upstream) is purged, never left behind
  # (`npx skills remove <name> -y`). `exclude` lists harness-owned entries that
  # the comparison ignores; `synced` is claude.ai-managed.
  skills:
    path: "~/.claude/skills"
    tracked: false
    writer: "npx skills add -a claude-code"
    exclude:
      - synced
  files:
    - path: "~/.claude/settings.json"
      tracked: true

commandcode:
  instructions:
    path: "~/.commandcode/AGENTS.md"
    tracked: true
    via: "Command Code reads ~/.commandcode/AGENTS.md natively; it imports ~/.agents/AGENTS.md"
  mcp:
    path: "~/.commandcode/mcp.json"
    tracked: true
    env_ref: "${VAR}"
    servers_at: "mcpServers"
    json_only: "Command Code reads mcp.json only; no mcp.jsonc loader exists (probed 2026-11-07)"
  skills:
    path: "~/.agents/skills"
    tracked: false
    writer: "npx skills experimental_install"
  files:
    - path: "~/.commandcode/settings.json"
      tracked: true
    - path: "~/.commandcode/omo-memory.md"
      tracked: false
      writer: "setup"
