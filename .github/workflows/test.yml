name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: oven-sh/setup-bun@v2

      - name: Test suite
        run: uv run --project .config/ai-config pytest -q .config/ai-config/tests

      - name: Doctor (repo-only drift check)
        run: uv run --project .config/ai-config python .config/ai-config/scripts/doctor.py --repo-only --home "$GITHUB_WORKSPACE"

      - name: Lint
        run: uv run --project .config/ai-config ty check .config/ai-config/lib .config/ai-config/scripts
